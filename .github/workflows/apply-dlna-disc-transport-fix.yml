name: Apply DLNA physical media transport fix

on:
  push:
    branches: [new_models]
    paths:
      - '.github/workflows/apply-dlna-disc-transport-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: new_models

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply source patch
        run: python tools/patch_dlna_disc_transport.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f test-requirements.txt ]; then pip install -r test-requirements.txt; fi

      - name: Run protocol tests
        run: python -m unittest discover -s tests -v

      - name: Run lint and format checks
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m pyright

      - name: Commit fix and remove temporary maintenance files
        run: |
          rm tools/patch_dlna_disc_transport.py
          rm .github/workflows/apply-dlna-disc-transport-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Do not expose DLNA renderer as disc transport"
          git push origin HEAD:new_models
