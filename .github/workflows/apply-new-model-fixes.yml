name: Apply new model fixes

on:
  push:
    branches: [new_models]
    paths:
      - '.github/workflows/apply-new-model-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new_models

      - name: Apply source fixes
        run: python tools/finish_new_models.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black

      - name: Format and verify
        run: |
          python -m black src/client.py src/sonyapilib/device.py tests/test_protocols.py --line-length 120
          python -m compileall -q src tests
          python -m unittest discover -s tests -v

      - name: Commit fixes and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/finish_new_models.py .github/workflows/apply-new-model-fixes.yml
          git add src/client.py src/sonyapilib/device.py tests/test_protocols.py
          git commit -m "Finish protocol capability support"
          git push origin HEAD:new_models
