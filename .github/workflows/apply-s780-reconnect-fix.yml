name: Apply S780 reconnect fix

on:
  push:
    paths:
      - '.github/workflows/apply-s780-reconnect-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: new_models
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python tools/apply_s780_reconnect_fix.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test-requirements.txt
      - name: Verify
        run: |
          python -m unittest discover -s tests -v
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m pyright
      - name: Commit
        run: |
          rm .github/workflows/apply-s780-reconnect-fix.yml tools/apply_s780_reconnect_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Avoid legacy API re-registration on reconnect'
          git push origin HEAD:new_models
