name: Retag and dispatch release

on:
  push:
    paths:
      - ".github/workflows/publish-temp-release.yml"

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move release tag to current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v1.7.0" "7e9eefee0af4a243512c567b568b277c4e87a310"
          git push --force origin "v1.7.0"
      - name: Dispatch Build & Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "v1.7.0"
