name: Publish stable release

on:
  push:
    paths:
      - ".github/workflows/publish-temp-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v1.7.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cd release-assets
          gh release download latest --repo "albaintor/integration-sonybluray" --pattern "uc-intg-sonybluray-v1.7.0-aarch64-*.tar.gz"
          src="$(find . -maxdepth 1 -type f -name 'uc-intg-sonybluray-v1.7.0-aarch64-*.tar.gz' | sort | tail -n 1)"
          test -n "$src"
          stable="uc-intg-sonybluray-v1.7.0-aarch64.tar.gz"
          mv "$src" "$stable"
          sha256sum "$stable" | sed 's#  #  #' > "uc-intg-sonybluray.hash"
          gh release create "v1.7.0" --repo "albaintor/integration-sonybluray" --title "v1.7.0" \
            --notes "Fix setup flow so starting or aborting setup no longer clears an existing shared configuration. Existing devices are preserved unless the explicit reset action is selected." \
            "$stable" "uc-intg-sonybluray.hash"
