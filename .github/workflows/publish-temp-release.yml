name: Dispatch tagged release build

on:
  push:
    paths:
      - ".github/workflows/publish-temp-release.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Build & Release on v1.7.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "v1.7.0"
