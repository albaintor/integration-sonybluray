name: Apply UPnP event probe extension

on:
  push:
    branches: [new_models]
    paths:
      - '.github/scripts/add_upnp_event_probe.py'
      - '.github/workflows/apply-upnp-event-probe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new_models
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply event probe extension
        run: python .github/scripts/add_upnp_event_probe.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f test-requirements.txt ]; then pip install -r test-requirements.txt; fi
      - name: Format probe
        run: python -m black src/playback_probe.py --line-length 120
      - name: Verify
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -p 'test*.py'
          python -m pylint src
          python -m flake8 src --count --show-source --statistics
          python -m black src --check --diff --verbose --line-length 120
      - name: Commit event probe extension and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/add_upnp_event_probe.py .github/workflows/apply-upnp-event-probe.yml
          git add src/playback_probe.py
          git commit -m 'Add UPnP GENA event diagnostics'
          git push origin HEAD:new_models
