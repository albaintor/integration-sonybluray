name: Ruff format migration

on:
  push:
    branches: [new_models]
    paths:
      - '.github/workflows/ruff-format-migration.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: new_models
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install ruff==0.15.21
      - name: Apply Ruff formatting
        run: python -m ruff format src
      - name: Commit formatting and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ruff-format-migration.yml
          git add src
          git commit -m 'Format source with Ruff'
          git push origin HEAD:new_models
