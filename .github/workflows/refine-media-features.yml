name: Refine media feature capabilities

on:
  push:
    branches: [new_models]
    paths:
      - '.github/scripts/refine_media_features.py'
      - '.github/workflows/refine-media-features.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new_models
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply capability refinement
        run: python .github/scripts/refine_media_features.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f test-requirements.txt ]; then pip install -r test-requirements.txt; fi
      - name: Format changed Python files
        run: python -m black src/sonyapilib/device.py src/media_player.py tests/test_protocols.py --line-length 120
      - name: Verify
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -p 'test*.py'
          python -m pylint src
          python -m flake8 src --count --show-source --statistics
          python -m black src --check --diff --verbose --line-length 120
      - name: Commit refinement and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/refine_media_features.py .github/workflows/refine-media-features.yml
          git add src/sonyapilib/device.py src/media_player.py tests/test_protocols.py
          git commit -m 'Refine media features for mixed Sony transports'
          git push origin HEAD:new_models
